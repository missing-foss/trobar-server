version = 1

# Files that can't carry an SPDX header (no comment syntax, or binary), and
# third-party assets vendored into the tree (which keep their upstream
# licensing). First-party source files carry in-file SPDX headers instead.

# --- First-party, no-comment or binary ---------------------------------------
[[annotations]]
path = [
    "LICENSE",
    "package.json",
    "package-lock.json",
    "dev/testlib.json",
    "dev/testlib-showcase.json",
    "VERSION",
    "docs/screenshots/*.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# --- First-party: the Trobar brand kit (rosette mark, themes) ----------------
# The mark, sync-state icons, tokens and web assets carry no lettering.
[[annotations]]
path = [
    "brand/BRAND.md",
    "brand/svg/mark/**",
    "brand/svg/states/**",
    "brand/png/mark/**",
    "brand/tokens/**",
    "brand/web/**",
    "brand/exports/trobar-mark-512.png",
    "docs/assets/brand/**",
    "app/static/img/favicon.ico",
    "app/static/img/favicon-*.png",
    "app/static/img/apple-touch-icon.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The lockups and wordmark also carry "Trobar" in Fredoka, outlined to paths.
[[annotations]]
path = [
    "brand/svg/lockup/**",
    "brand/png/lockup/**",
    "brand/exports/social-preview-1280x640.png",
    "app/static/img/brand/lockup-*.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 missing-foss", "2016 The Fredoka Project Authors"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND OFL-1.1"

# The kit's copy of Fredoka's licence text.
[[annotations]]
path = "brand/licenses/Fredoka-OFL.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Fredoka Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# --- Third-party: bundled fonts (Google Fonts, SIL Open Font License) ---------
[[annotations]]
path = "app/static/fonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2016 The Fredoka Project Authors",
    "2020 The Space Grotesk Project Authors",
    "2016 The Space Mono Project Authors",
]
SPDX-License-Identifier = "OFL-1.1"

# --- Third-party: vendored JS/CSS libraries (MIT) ----------------------------
[[annotations]]
path = "app/static/js/alpine-3.14.9.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 Caleb Porzio and contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "app/static/js/chart-4.5.1.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Chart.js Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "app/static/js/qrcode-1.4.4.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "2012 Sangmin An"
SPDX-License-Identifier = "MIT"

# Generated by Tailwind CSS (a committed build artifact — see the tailwind note
# in project_dev_workflow); the utility CSS it emits is Tailwind's, MIT.
[[annotations]]
path = "app/static/css/tailwind.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 Tailwind Labs Inc."
SPDX-License-Identifier = "MIT"

# --- Third-party: badges / donate marks --------------------------------------
[[annotations]]
path = "app/static/img/badge_obtainium.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 Obtainium contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "app/static/img/liberapay-donate.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Liberapay"
SPDX-License-Identifier = "CC0-1.0"

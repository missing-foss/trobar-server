name: Feature request
description: Something Trobar should do
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you currently can't (or can't do comfortably)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What would it look like if it worked the way you want?
    validations:
      required: true

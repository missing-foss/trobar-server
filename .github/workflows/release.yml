# WHERE THIS RUNS: the published mirror, under GitHub Actions only. The
# development environment's CI reads its own workflow directory and, once
# that directory exists, takes nothing from `.github/`; so this file never
# runs there, and its absence from those runs is correct.

# Release: fires on a bare vX.Y.Z tag.
#
# RE-RUNS: dispatch this workflow FROM THE TAG (pick the tag, not a branch,
# as the ref in the dispatch dialog). There is no "tag" input on purpose: a
# dispatch runs every job on the ref it was dispatched from -- the checkout,
# the called gates and GITHUB_REF_NAME all agree -- so dispatching from the
# tag re-checks exactly the tagged tree, and an input naming some other tag
# would have checked VERSION on one commit and run the gates on another.
#
# NO IMAGE, NO ARTIFACT FROM CI. Releases of this server are built and
# signed by the release process outside this workflow; what this does is
# prove the tag is honest, run every gate a pull request runs, and open a
# DRAFT release for a human to finish and publish. The draft is the
# handoff point -- nothing is public until a human publishes it.
#
# Modelled on the equivalent workflow in the organisation's watch app,
# with one difference: the version of record here is the VERSION file.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs BEFORE the gates. A tag that disagrees with VERSION is wrong no
  # matter how green the tests are, and finding that out first is cheaper.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag must match VERSION
        # The ref reaches the script through the environment, never
        # interpolated into its text; the same treatment the draft job gives
        # the tag below.
        env:
          REF: ${{ github.ref_name }}
        run: |
          # A dispatch from a branch named like a version would otherwise pass,
          # and the draft would then carry a tag GitHub creates on publish, on
          # the default branch's head rather than on the commit checked here.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::'$REF' is a $GITHUB_REF_TYPE, not a tag -- dispatch this from the tag"
            exit 1
          fi
          ref="$REF"
          case "$ref" in
            v*) ;;
            *) echo "::error::tag '$ref' does not start with 'v' — releases are tagged vX.Y.Z"; exit 1 ;;
          esac
          tag_version="${ref#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag_version  VERSION=$file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $ref implies version $tag_version but VERSION says $file_version — bump VERSION or retag"
            exit 1
          fi
      - name: CHANGELOG.md has a section for this version
        # A release says what changed. The section is "## [X.Y.Z]", a date
        # after it optional, with at least one "- " entry before the next
        # "## ", so an empty heading doesn't pass. Same environment-only
        # treatment of the ref as the step above.
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          if awk -v h="## [$version]" '
              index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { inside = 1; next }
              /^## / { inside = 0 }
              inside && /^- / { found = 1 }
              END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has entries for $version"
          else
            echo "::error::CHANGELOG.md has no '## [$version]' section with an entry — add one before tagging"
            exit 1
          fi

  # The same gates a pull request runs — called, not copied, so they cannot
  # drift from what merges see.
  gates:
    needs: [version-check]
    uses: ./.github/workflows/ci.yml

  draft-release:
    needs: [version-check, gates]
    runs-on: ubuntu-latest
    # Only this job needs write, and only to create the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release notes from CHANGELOG.md
        # The draft's notes are this version's CHANGELOG.md section, written
        # and reviewed in the version-bump pull request, then the fixed line(s)
        # below. A missing or empty section stops the job before any draft
        # exists. Its own step, so it can be run alone to see the body.
        env:
          TAG: ${{ github.ref_name }}
          SUPPORT_LINE: "If Trobar is useful to you, you can support its development on Ko-fi: https://ko-fi.com/missingfoss"
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          # The lines after "## [X.Y.Z]" (a date after it optional), up to the
          # next "## ", without the blank lines at either end.
          awk -v h="## [$version]" '
              index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { inside = 1; next }
              inside && /^## / { exit }
              inside { print }' CHANGELOG.md \
            | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$notes"
          # A relative link (docs/..., README.md#...) would resolve against the
          # release page; point it at the file as it is at this tag.
          sed -i -E "s#\]\(([^)#:][^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/\1)#g" "$notes"
          if ! grep -q '^- ' "$notes"; then
            echo "::error::CHANGELOG.md has no '## [$version]' section with an entry -- no draft without release notes"
            exit 1
          fi
          printf '\n%s\n' "$SUPPORT_LINE" >> "$notes"
          echo "--- release notes for $TAG ---"
          cat "$notes"
      - name: Create the draft release, or leave an existing one alone
        # `gh` in a run: step rather than a third-party release action — the
        # organisation's Actions policy allows GitHub-owned and
        # verified-creator actions only.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it alone"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --draft \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ### $TAG — draft release created

          Tag matches \`VERSION\`, and every gate passed.

          Nothing is published by this workflow: the draft is the handoff
          point, finished and published by a human as part of the release
          process.
          SUMMARY

# WHERE THIS RUNS: the published mirror, under GitHub Actions only. The
# development environment's CI reads its own workflow directory and, once
# that directory exists, takes nothing from `.github/`; so this file never
# runs there, and its absence from those runs is correct.

# Release: fires on a bare vX.Y.Z tag.
#
# RE-RUNS: dispatch this workflow FROM THE TAG (pick the tag, not a branch,
# as the ref in the dispatch dialog). There is no "tag" input on purpose: a
# dispatch runs every job on the ref it was dispatched from -- the checkout,
# the called gates and GITHUB_REF_NAME all agree -- so dispatching from the
# tag re-checks exactly the tagged tree, and an input naming some other tag
# would have checked VERSION on one commit and run the gates on another.
#
# NO IMAGE, NO ARTIFACT FROM CI. Releases of this server are built and
# signed by the release process outside this workflow; what this does is
# prove the tag is honest, run every gate a pull request runs, and open a
# DRAFT release for a human to finish and publish. The draft is the
# handoff point -- nothing is public until a human publishes it.
#
# Modelled on the equivalent workflow in the organisation's watch app,
# with one difference: the version of record here is the VERSION file.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs BEFORE the gates. A tag that disagrees with VERSION is wrong no
  # matter how green the tests are, and finding that out first is cheaper.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag must match VERSION
        # The ref reaches the script through the environment, never
        # interpolated into its text; the same treatment the draft job gives
        # the tag below.
        env:
          REF: ${{ github.ref_name }}
        run: |
          ref="$REF"
          case "$ref" in
            v*) ;;
            *) echo "::error::tag '$ref' does not start with 'v' — releases are tagged vX.Y.Z"; exit 1 ;;
          esac
          tag_version="${ref#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag_version  VERSION=$file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $ref implies version $tag_version but VERSION says $file_version — bump VERSION or retag"
            exit 1
          fi

  # The same gates a pull request runs — called, not copied, so they cannot
  # drift from what merges see.
  gates:
    needs: [version-check]
    uses: ./.github/workflows/ci.yml

  draft-release:
    needs: [version-check, gates]
    runs-on: ubuntu-latest
    # Only this job needs write, and only to create the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the previous tag, for the notes' starting point
      - name: Create the draft release, or leave an existing one alone
        # `gh` in a run: step rather than a third-party release action — the
        # organisation's Actions policy allows GitHub-owned and
        # verified-creator actions only.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it alone"
          else
            previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')"
            if [ -n "$previous" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --draft --generate-notes --notes-start-tag "$previous"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --draft --generate-notes
            fi
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ### $TAG — draft release created

          Tag matches \`VERSION\`, and every gate passed.

          Nothing is published by this workflow: the draft is the handoff
          point, finished and published by a human as part of the release
          process.
          SUMMARY

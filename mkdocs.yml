site_name: Trobar
site_url: https://missing-foss.github.io/trobar-server/
repo_url: https://github.com/missing-foss/trobar-server

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

# Build strictly: every docs/*.md must be in nav, internal links must resolve,
# and internal anchors must exist. External links (GitHub, README, SECURITY.md,
# .env.example) are https URLs and aren't validated. `mkdocs build --strict`
# escalates any of these to an error.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# `admonition` is NOT one of MkDocs' built-in defaults (those are toc, tables
# and fenced_code, which is why those three have always worked here). Without
# it every `!!! note` / `!!! warning` block is passed through as ordinary text,
# so the published page shows a literal `!!! warning "..."` paragraph followed
# by the body run together -- which is what the site did until this was added.
# `--strict` cannot catch it: unparsed markdown is valid text, not a warning.
# Only `admonition` is listed because it is all the docs use: no `???`
# collapsibles, no `===` tabs, no footnotes -- add the matching extension
# alongside the first page that needs one.
markdown_extensions:
  - admonition
  # `???` collapsible blocks, for content a page itself says most readers
  # don't need. Both come from pymdown-extensions, which mkdocs-material
  # already depends on -- docs/requirements.txt needs nothing added.
  #
  # superfences is REQUIRED here, not decorative: a ``` fence nested inside a
  # `???` block does not become a code block without it. Measured on
  # networking.md's collapsed block, which contains exactly such a fence --
  # without superfences the output has no <pre> at all and the shell command
  # renders as flowed prose (the fence markers are consumed, so it does NOT
  # show as literal backticks, which is what makes it easy to miss).
  # If you test this yourself, assert on `<pre`, not on `<code>`: inline
  # `code` spans in the surrounding paragraph satisfy a `<code>` check and
  # will tell you it works when it doesn't.
  - pymdownx.details
  - pymdownx.superfences

